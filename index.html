<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Procedural Furniture</title>
  <style>
    :root {
      --bg: #f5f3ef;
      --ground: #ece8e1;
      --panel: #ffffffd9;
      --border: #e2ddd4;
      --text: #2b2a28;
      --muted: #8a857c;
      --accent: #2b2a28;
      --on-accent: #ffffff;
      --focus: #c9c2b5;
      --shadow: 0 8px 24px #0000000f;
      --r-input: 6px;
      --r-panel: 8px;
      --r-card: 10px;
      --hit: 32px;
      --sheet-h: 0px;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
    }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
    button { font: inherit; color: inherit; cursor: pointer; }
    button:disabled { opacity: 0.35; cursor: default; }
    kbd {
      font: 11px ui-monospace, Consolas, monospace;
      padding: 1px 5px;
      border: 1px solid var(--border);
      border-bottom-width: 2px;
      border-radius: 4px;
      background: #fff;
      color: var(--text);
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
    .floating {
      background: var(--panel);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      border: 1px solid var(--border);
      border-radius: var(--r-panel);
    }

    #top {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      min-height: 52px;
      border-bottom: 1px solid var(--border);
      background: #fff;
      flex: none;
      position: relative;
      z-index: 5;
    }
    h1 { font-size: 15px; font-weight: 600; margin: 0; flex: 1; white-space: nowrap; }
    .seedgrp { flex: 1; display: flex; justify-content: flex-end; align-items: center; gap: 12px; }
    label { color: var(--muted); }
    #seed {
      font: 13px ui-monospace, Consolas, monospace;
      width: 160px;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: var(--r-input);
      background: var(--bg);
      color: var(--text);
    }
    #seed:focus { outline: 2px solid var(--focus); outline-offset: 0; }
    .btn {
      padding: 6px 14px;
      border: 0;
      border-radius: var(--r-input);
      background: var(--accent);
      color: var(--on-accent);
    }
    .btn:hover:not(:disabled) { opacity: 0.85; }
    .btn svg { display: none; width: 20px; height: 20px; }
    svg.i { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .icon-btn {
      width: var(--hit);
      height: var(--hit);
      display: inline-grid;
      place-items: center;
      border: 0;
      border-radius: var(--r-input);
      background: transparent;
      color: var(--text);
      padding: 0;
    }
    .icon-btn:hover { background: var(--bg); }
    .icon-btn svg { width: 18px; height: 18px; }
    .icon-btn[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

    .chip-wrap { flex: none; }
    .chips {
      display: inline-flex;
      gap: 2px;
      padding: 2px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--r-panel);
    }
    .chip {
      border: 0;
      background: transparent;
      padding: 4px 12px;
      border-radius: var(--r-input);
      font-size: 13px;
      white-space: nowrap;
    }
    .chip:hover { background: #fff; }
    .chip[aria-checked="true"] { background: var(--accent); color: var(--on-accent); }

    .menu-wrap { position: relative; }
    #menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      min-width: 220px;
      padding: 4px;
      background: #fffffff2;
      border: 1px solid var(--border);
      border-radius: var(--r-panel);
      box-shadow: var(--shadow);
    }
    #menu button {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      width: 100%;
      padding: 6px 10px;
      border: 0;
      border-radius: var(--r-input);
      background: transparent;
      text-align: left;
    }
    #menu button:hover:not(:disabled) { background: var(--bg); }
    #menu kbd, #menu .state { color: var(--muted); }

    #viewport { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--bg); }
    #viewport canvas { display: block; }

    #panel {
      position: absolute;
      left: 16px;
      bottom: 16px;
      width: 300px;
      max-height: calc(100% - 32px);
      overflow: auto;
      padding: 10px 14px;
    }
    .p-head { display: flex; align-items: baseline; gap: 8px; cursor: pointer; min-width: 0; }
    .p-head .tri { font-size: 10px; color: var(--muted); transition: transform 0.15s; }
    #panel[data-open="false"] .tri { transform: rotate(-90deg); }
    .p-head b { font-weight: 600; white-space: nowrap; }
    .iseed { font: 12px ui-monospace, Consolas, monospace; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .p-head .meta, .p-head .chev, .grab, .peekrow, .p-sub .iseed { display: none; }
    .p-sub { color: var(--muted); font-size: 12px; margin: 0 0 2px 18px; min-height: 17px; }
    #panel[data-open="false"] .p-body, #panel[data-open="false"] .actions { display: none; }
    .group { margin-top: 8px; }
    .group header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      min-height: 22px;
    }
    .group dl { display: grid; grid-template-columns: auto auto; gap: 1px 16px; margin: 2px 0 0; }
    dt { color: var(--muted); }
    dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
    dd.flash { animation: flash 0.6s ease-out; border-radius: 4px; }
    @keyframes flash { from { background: var(--ground); } to { background: transparent; } }
    .no-motion dd.flash { animation: none; }
    .swatch { display: inline-block; width: 14px; height: 14px; margin-left: 4px; border-radius: 3px; border: 1px solid #0002; vertical-align: middle; }
    .roll, .back {
      display: inline-grid;
      place-items: center;
      min-width: 24px;
      height: 22px;
      padding: 0 6px;
      font-size: 13px;
      letter-spacing: 0;
      border: 1px solid var(--border);
      border-radius: var(--r-input);
      background: transparent;
      color: var(--text);
    }
    .roll:hover, .back:hover { background: var(--bg); }
    .rollctl { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: var(--r-input); overflow: hidden; }
    .rollctl .roll, .rollctl .back { border: 0; border-radius: 0; }
    .rollctl .count { min-width: 16px; text-align: center; font-size: 11px; font-variant-numeric: tabular-nums; color: var(--muted); letter-spacing: 0; }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
    .btn2 { padding: 4px 10px; font-size: 13px; border: 1px solid var(--border); border-radius: var(--r-input); background: transparent; color: var(--text); }
    .btn2:hover:not(:disabled) { background: var(--bg); }

    #viewctl { position: absolute; right: 16px; bottom: 16px; display: flex; gap: 2px; padding: 4px; }
    .tip { position: relative; }
    @media (hover: hover) {
      .tip:hover::after {
        content: attr(data-tip);
        position: absolute;
        bottom: calc(100% + 8px);
        right: 0;
        white-space: nowrap;
        padding: 3px 8px;
        font-size: 12px;
        border-radius: var(--r-input);
        background: var(--accent);
        color: var(--on-accent);
        pointer-events: none;
      }
    }
    #viewctl [data-view="full"] .on, #viewctl [data-view="full"][data-active="true"] .off { display: none; }
    #viewctl [data-view="full"][data-active="true"] .on { display: block; }

    #loader { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
    .loader-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      min-width: 240px;
      max-width: calc(100% - 32px);
      padding: 20px 24px;
      background: var(--panel);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      border: 1px solid var(--border);
      border-radius: var(--r-card);
      box-shadow: var(--shadow);
    }
    #loader-text { font-variant-numeric: tabular-nums; color: var(--muted); }
    .spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .bar { width: 100%; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
    #loader-bar { width: 0; height: 100%; background: var(--accent); transition: width 0.1s linear; }

    #stepper { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 3px; z-index: 2; }
    #stepper .label { padding: 0 10px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
    #stepper .sep { width: 1px; align-self: stretch; background: var(--border); margin: 3px 2px; }
    #stepper .icon-btn { width: 28px; height: 28px; font-size: 16px; }
    #stepper .txt { border: 0; background: transparent; padding: 4px 10px; border-radius: var(--r-input); font-size: 13px; color: var(--muted); white-space: nowrap; }
    #stepper .txt:hover { background: var(--bg); color: var(--text); }
    #spin-hint { position: absolute; top: 64px; left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--muted); white-space: nowrap; pointer-events: none; }

    #toast {
      position: absolute;
      left: 50%;
      bottom: calc(var(--sheet-h) + 16px);
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: calc(100% - 32px);
      padding: 8px 14px;
      font-size: 13px;
      box-shadow: var(--shadow);
      white-space: nowrap;
      z-index: 6;
    }
    #toast input { font: 12px ui-monospace, Consolas, monospace; width: 220px; padding: 3px 6px; border: 1px solid var(--border); border-radius: var(--r-input); background: var(--bg); color: var(--text); }

    #help { position: absolute; inset: 0; display: grid; place-items: center; background: #2b2a2814; z-index: 7; }
    .help { width: 420px; max-width: calc(100% - 32px); padding: 16px 20px; border-radius: var(--r-card); box-shadow: var(--shadow); background: #fffffff2; border: 1px solid var(--border); }
    .help:focus { outline: none; }
    .help h2 { margin: 0 0 10px; font-size: 14px; }
    .help dl { display: grid; grid-template-columns: 110px 1fr; gap: 5px 12px; margin: 0; }
    .help dt { color: var(--text); }
    .help dd { text-align: left; color: var(--muted); }

    #nogl { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 20px 24px; border-radius: var(--r-card); box-shadow: var(--shadow); }

    #viewport:fullscreen { background: var(--bg); }

    #viewport[data-walk="true"] :is(#panel, #viewctl, #stepper, #spin-hint) { display: none !important; }
    #walk-hint { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 3; }
    #walk-hint .crosshair { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px #ffffffb0; }
    #walk-hint .resume { pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 20px; box-shadow: var(--shadow); }
    #walk-hint .resume b { font-weight: 600; }
    #walk-hint .resume span { color: var(--muted); font-size: 12px; }
    #walk-hint .keys { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); padding: 6px 12px; font-size: 12px; color: var(--muted); white-space: nowrap; }
    #walk-hint[data-state="locked"] .resume, #walk-hint[data-state="paused"] .crosshair { display: none; }

    @media (min-width: 640px) and (max-width: 1023px) {
      #top { flex-wrap: wrap; row-gap: 8px; }
      h1 { flex: 1; }
      .seedgrp { flex: none; }
      .chip-wrap { order: 3; flex: 1 1 100%; overflow-x: auto; scrollbar-width: none; }
      .chip-wrap::-webkit-scrollbar { display: none; }
      #panel { width: min(300px, calc(100% - 32px - 112px - 12px)); }
    }

    @media (max-width: 639px) {
      :root { --hit: 44px; }
      #top { flex-direction: column; align-items: stretch; padding: 8px 12px 6px; gap: 6px; }
      h1, .seedgrp label { display: none; }
      .seedgrp { flex: none; justify-content: stretch; gap: 8px; }
      #seed { flex: 1; width: auto; min-width: 0; font-size: 16px; height: 40px; }
      .btn { width: 44px; height: 40px; padding: 0; display: grid; place-items: center; }
      .btn .lbl { display: none; }
      .btn svg { display: block; }
      .chip-wrap {
        overflow-x: auto;
        scrollbar-width: none;
        scroll-snap-type: x proximity;
        -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent);
        mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent);
      }
      .chip-wrap::-webkit-scrollbar { display: none; }
      .chip { height: 34px; padding: 0 16px; font-size: 14px; scroll-snap-align: center; }
      #menu { right: -4px; }

      #panel {
        left: 0;
        right: 0;
        bottom: 0;
        width: auto;
        max-height: none;
        height: var(--sheet-h);
        padding: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border-width: 1px 0 0;
        border-radius: var(--r-card) var(--r-card) 0 0;
        box-shadow: 0 -8px 24px #0000000f;
        transition: height 0.2s ease-out;
      }
      .grab { display: grid; place-items: center; height: 18px; flex: none; width: 100%; border: 0; background: transparent; padding: 0; touch-action: none; }
      .grab::before { content: ""; width: 36px; height: 4px; border-radius: 2px; background: var(--border); }
      .p-head { padding: 0 16px 4px; flex: none; align-items: center; touch-action: none; }
      .p-head .tri, .p-head .iseed { display: none; }
      .p-head .meta { display: block; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
      .p-head .chev { display: block; color: var(--muted); font-size: 12px; margin-left: auto; }
      .p-sub { margin: 0; }
      .p-sub [data-panel-sub] { display: none; }
      .p-sub .iseed { display: block; }
      .peekrow { display: flex; gap: 8px; padding: 0 16px; overflow-x: auto; scrollbar-width: none; flex: none; touch-action: pan-x; }
      .peekrow .pr { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
      #panel[data-detent="peek"] .p-body, #panel[data-detent="peek"] .actions { display: none; }
      #panel:not([data-detent="peek"]) .peekrow { display: none; }
      #panel[data-detent="full"] .p-body { touch-action: pan-y; }
      .p-body { flex: 1; overflow: auto; padding: 0 16px; min-height: 0; overscroll-behavior: contain; }
      .actions { flex: none; margin: 0; padding: 10px 16px calc(14px + env(safe-area-inset-bottom)); background: transparent; }
      .actions .btn2 { height: 40px; padding: 0 14px; font-size: 14px; }
      .roll, .back { min-width: 36px; height: 36px; font-size: 15px; }
      .group header { min-height: 40px; }
      .group dl { gap: 3px 16px; }
      .peekrow .roll, .peekrow .back { min-width: 32px; height: 28px; font-size: 14px; }

      #viewctl { flex-direction: column; right: 12px; bottom: calc(var(--sheet-h) + 12px); }
      #viewport[data-detent="full"] #viewctl { display: none; }
      #loader { bottom: 72px; }
      #stepper { top: 10px; }
      #spin-hint { top: 52px; }
      .help dl { grid-template-columns: 90px 1fr; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header id="top">
    <h1>Procedural Furniture</h1>
    <div class="chip-wrap"><div class="chips" id="chips" role="radiogroup" aria-label="Furniture type"></div></div>
    <div class="seedgrp">
      <label for="seed">Seed</label>
      <input id="seed" type="text" spellcheck="false" autocomplete="off" title="Type a seed and press Enter ( / to focus)" />
      <button id="regen" class="btn" type="button" title="New seed (R)" aria-label="Regenerate">
        <span class="lbl">Regenerate</span>
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r=".8" fill="currentColor"/><circle cx="15" cy="15" r=".8" fill="currentColor"/><circle cx="15" cy="9" r=".8" fill="currentColor"/><circle cx="9" cy="15" r=".8" fill="currentColor"/></svg>
      </button>
      <button id="walk" class="icon-btn" type="button" aria-label="Walk mode" aria-pressed="false" title="Walk mode: WASD to move, mouse to look, Space to jump, C to crouch">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="13.5" cy="4.5" r="1.8"/><path d="M9 21l2.5-6 2.5 2.5V21"/><path d="M11.5 15l1-6.5"/><path d="M7.5 12l1.5-3.5 3.5-.5 2.5 3 2.5 1"/></svg>
      </button>
      <div class="menu-wrap">
        <button id="more" class="icon-btn" type="button" aria-label="More" title="Shortcuts, clear all rolls, animations" aria-haspopup="menu" aria-expanded="false">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r=".9" fill="currentColor"/><circle cx="12" cy="12" r=".9" fill="currentColor"/><circle cx="18" cy="12" r=".9" fill="currentColor"/></svg>
        </button>
        <div id="menu" role="menu" hidden>
          <button type="button" role="menuitem" data-menu="help"><span>Keyboard shortcuts</span><kbd>?</kbd></button>
          <button type="button" role="menuitem" data-menu="clear" disabled>Clear all rolls</button>
          <button type="button" role="menuitemcheckbox" data-menu="anim" aria-checked="true"><span>Animations</span><span class="state">On</span></button>
        </div>
      </div>
    </div>
  </header>
  <div id="viewport" data-detent="peek">
    <div id="loader" hidden>
      <div class="loader-card">
        <div class="spinner"></div>
        <div id="loader-text">Generating…</div>
        <div class="bar" id="loader-barwrap"><div id="loader-bar"></div></div>
      </div>
    </div>
    <div id="stepper" class="floating" role="toolbar" aria-label="Solo item" hidden>
      <button type="button" class="txt" data-stepper="grid">← Grid</button>
      <span class="sep"></span>
      <button type="button" class="icon-btn" data-step="-1" aria-label="Previous item (Left arrow)">‹</button>
      <span class="label" id="stepper-label"></span>
      <button type="button" class="icon-btn" data-step="1" aria-label="Next item (Right arrow)">›</button>
    </div>
    <div id="spin-hint" hidden>turntable · <kbd>Space</kbd> pauses</div>
    <div id="panel" class="floating" role="region" aria-label="Item parameters" data-open="true" data-detent="peek" hidden>
      <button type="button" class="grab" data-panel-grab aria-label="Resize panel"></button>
      <div class="p-head" data-panel-head role="button" tabindex="0" aria-expanded="true">
        <span class="tri" aria-hidden="true">▾</span><b data-panel-title></b><span class="iseed" data-panel-seed></span><span class="meta" data-panel-meta></span><span class="chev" aria-hidden="true">▴</span>
      </div>
      <div class="peekrow" data-panel-peek></div>
      <div class="p-body">
        <div class="p-sub"><span data-panel-sub></span><span class="iseed" data-panel-seed2></span></div>
        <div data-panel-sections></div>
      </div>
      <div class="actions">
        <button type="button" class="btn2" data-action="reset">Reset rolls</button>
        <button type="button" class="btn2" data-action="copy">Copy link</button>
        <button type="button" class="btn2" data-action="solo" title="Solo view (Enter)">Solo</button>
      </div>
    </div>
    <div id="viewctl" class="floating" role="toolbar" aria-label="View">
      <button type="button" class="icon-btn tip" data-view="reset" aria-label="Reset camera" data-tip="Reset camera (Home)">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/><circle cx="12" cy="12" r="1.6"/></svg>
      </button>
      <button type="button" class="icon-btn tip" data-view="full" aria-label="Fullscreen" data-tip="Fullscreen (F)">
        <svg class="i off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        <svg class="i on" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
      </button>
      <button type="button" class="icon-btn tip" data-view="shot" aria-label="Screenshot" data-tip="Screenshot (P)">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      </button>
    </div>
    <div id="walk-hint" data-state="paused" hidden>
      <div class="crosshair"></div>
      <button type="button" class="resume floating"><b>Click to look around</b><span>Esc leaves walk mode</span></button>
      <div class="keys floating"><kbd>W A S D</kbd> move · <kbd>Space</kbd> jump · <kbd>Shift</kbd> run · <kbd>C</kbd> crouch · <kbd>Esc</kbd> release mouse</div>
    </div>
    <div id="toast" class="floating" role="status" hidden></div>
    <div id="nogl" class="floating" role="alert" hidden>This needs WebGL. Try another browser.</div>
    <div id="help" hidden>
      <div class="help" role="dialog" aria-modal="true" aria-label="Keyboard shortcuts" tabindex="-1">
        <h2>Keyboard shortcuts</h2>
        <dl></dl>
      </div>
    </div>
  </div>
  <div id="live" class="sr-only" aria-live="polite"></div>
  <script type="module" src="./src/app/main.js"></script>
</body>
</html>

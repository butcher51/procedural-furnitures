<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Pattern board</title>
  <style>
    html, body { margin: 0; background: #f5f3ef; color: #2b2a28; font: 12px/1.3 system-ui, "Segoe UI", sans-serif; }
    #board { position: relative; }
    #board canvas { display: block; }
    .label { position: absolute; left: 8px; padding: 2px 6px; background: #ffffffd9; border-radius: 4px; }
    .label small { color: #8a857c; }
    .head { position: absolute; top: 4px; font-weight: 600; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="board"></div>
  <script type="module" src="./patterns.js"></script>
</body>
</html>
